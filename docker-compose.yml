version: "3.9"

services:
  api:
    build: ./assets/fastapi_app
    container_name: reliable-api-demo
    ports:
      - "8080:8080"
    env_file:
      - ./assets/.env
    environment:
      ENABLE_HTTPS_REDIRECT: "false"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ALLOW_ORIGINS: "http://localhost,http://127.0.0.1"
      RATE_LIMIT_RPS: "5"
    read_only: false
    restart: unless-stopped
